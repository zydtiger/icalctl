[package]
name = "icalctl"
version = "0.1.0"
edition = "2024"
description = "A macOS Apple Calendar CLI backed by EventKit"
license = "MIT"
readme = "README.md"
keywords = ["calendar", "eventkit", "macos", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
embed_plist = "1.2"
eventkit = { package = "eventkit-rs", version = "0.5.6", default-features = false, features = ["events"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
