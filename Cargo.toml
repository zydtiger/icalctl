[package]
name = "icalctl"
version = "0.1.0"
edition = "2024"
description = "A macOS Apple Calendar and Reminders CLI backed by EventKit"
license = "MIT"
readme = "README.md"
keywords = ["calendar", "eventkit", "macos", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
embed_plist = "1.2"
eventkit = { package = "eventkit-rs", version = "0.5.6", default-features = false, features = ["events"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
rpassword = "7"
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-location = { version = "0.3", features = ["CLLocation", "CLLocationManager"] }
objc2-event-kit = { version = "0.3", features = ["EKAlarm", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKRecurrenceDayOfWeek", "EKRecurrenceEnd", "EKRecurrenceRule", "EKReminder", "EKSource", "EKStructuredLocation", "EKTypes", "objc2-core-location"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSCalendar", "NSDate", "NSError", "NSPredicate", "NSString", "NSTimeZone", "NSURL"] }
